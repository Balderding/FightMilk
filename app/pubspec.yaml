name: workout
description: "Free, private workout app: designs heavy-lifting workouts, logs sets, shows progress."
publish_to: 'none'
version: 0.7.2+10

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.7.1
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  ffi: ^2.2.0
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/icons/
    - assets/sounds/
